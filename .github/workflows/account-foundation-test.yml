name: Account Foundation Test

on:
  push:
    branches:
      - zc-task-20260909-001-account-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Account Foundation tests
        run: npm test
