name: ZERO CALL Foundation Test

on:
  push:
    branches:
      - 'zc-task-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ZERO CALL tests
        run: npm test
